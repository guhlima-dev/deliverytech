spring.application.name=delivery-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false
spring.h2.console.settings.web-allow-others=true

logging.level.org.springframework.web=DEBUG
logging.level.root=INFO
logging.level.com.deliverytech.delivery_api=DEBUG

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoints.web.exposure.include=health,info,metrics,env,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/zipkin/api/v2/spans

management.metrics.enabled.all=true

management.endpoint.info.enabled=true
management.info.env.enabled=true
info.app.name=Delivery Tech Api
info.app.version=1.0.0
info.app.description=API de delivery